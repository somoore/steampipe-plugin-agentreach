name: agentreach
description: Read-only posture scan for AI coding agents, with SARIF for GitHub code scanning.
author: Scott Moore
branding:
  icon: shield
  color: blue

inputs:
  version:
    description: agentreach release tag to download.
    default: v0.2.0
  fail-on:
    description: Fail on paths at or below this gate (auto, classifier, prompt, never).
    default: auto
  args:
    description: Extra arguments for agentreach scan, for example a project directory.
    default: ""

outputs:
  sarif:
    description: Path to the SARIF file that was uploaded.
    value: ${{ steps.scan.outputs.sarif }}
  exit-code:
    description: agentreach exit code (0 clean, 1 failing findings, 2 not fully assessed).
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        AGENTREACH_VERSION: ${{ inputs.version }}
        AGENTREACH_FAIL_ON: ${{ inputs.fail-on }}
        AGENTREACH_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        ver="${AGENTREACH_VERSION#v}"
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$(uname -m)" in
          arm64|aarch64) arch=arm64 ;;
          x86_64|amd64)  arch=amd64 ;;
          *) echo "agentreach: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        case "$os" in
          darwin|linux) ;;
          *) echo "agentreach: unsupported OS $os" >&2; exit 1 ;;
        esac
        asset="agentreach_${ver}_${os}_${arch}.tar.gz"
        base="https://github.com/somoore/steampipe-plugin-agentreach/releases/download/v${ver}"
        tmp="$(mktemp -d)"
        curl -fsSL "$base/$asset" -o "$tmp/$asset"
        curl -fsSL "$base/checksums.txt" -o "$tmp/checksums.txt"
        if command -v sha256sum >/dev/null 2>&1; then
          (cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum -c -)
        else
          (cd "$tmp" && grep " $asset\$" checksums.txt | shasum -a 256 -c -)
        fi
        tar -xzf "$tmp/$asset" -C "$tmp"
        sarif="${GITHUB_WORKSPACE}/agentreach.sarif"
        code=0
        "$tmp/agentreach" scan --format sarif --out "$sarif" --fail-on "$AGENTREACH_FAIL_ON" $AGENTREACH_ARGS || code=$?
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
      if: steps.scan.outputs.sarif != ''
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: agentreach

    - shell: bash
      run: exit ${{ steps.scan.outputs.exit-code }}
